name: Deploy to InfinityFree

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp
      
      - name: Deploy via lftp
        run: |
          lftp -c "
          set ftp:ssl-allow no
          set ftp:passive-mode yes
          set mirror:use-pget-n 3
          set cmd:fail-exit off
          open -u ${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }} ${{ secrets.FTP_HOST }}
          mirror -R --verbose --parallel=4 --exclude-glob .git/ --exclude-glob .github/ --no-perms --ignore-time ./ ${{ secrets.FTP_TARGET_FOLDER }}
          quit
          "
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_TARGET_FOLDER: ${{ secrets.FTP_TARGET_FOLDER }}
      
      - name: Verify deployment
        run: echo "✅ Deployment completed! Files have been uploaded to InfinityFree."
